name: GitHub Jira Manager V1 CI

on:
  pull_request:
    paths:
      - 'projects/github-jira-manager/**'
      - 'projects/sthapati-recovery/**'
      - '.github/workflows/github-jira-manager-v1-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'projects/github-jira-manager/**'
      - 'projects/sthapati-recovery/**'
      - '.github/workflows/github-jira-manager-v1-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate GitHub Jira Manager control plane
        run: |
          python projects/github-jira-manager/tests/validate_v1.py
          python -m unittest discover -s projects/github-jira-manager/tests -p 'test_*.py' -v
      - name: Validate Sthapati recovery patchset
        if: ${{ hashFiles('projects/sthapati-recovery/tests/validate_public_recovery.py') != '' }}
        run: python projects/sthapati-recovery/tests/validate_public_recovery.py
