name: Sthapati Recovery CI

on:
  pull_request:
    paths:
      - 'projects/sthapati-recovery/**'
      - '.github/workflows/sthapati-recovery-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'projects/sthapati-recovery/**'
      - '.github/workflows/sthapati-recovery-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public recovery patchset
        run: python projects/sthapati-recovery/tests/validate_public_recovery.py
