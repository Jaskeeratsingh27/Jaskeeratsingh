name: Hermes Architecture CI

on:
  push:
    branches:
      - main
      - 'hermes-architecture-v*'
    paths:
      - '.agents/skills/hermes-agent-architecture/**'
      - '.agents/skills/hermes-agent-creator/SKILL.md'
      - 'SKILLS.md'
      - '.claude/skills/hermes-agent-architecture/**'
      - '.github/workflows/hermes-architecture-ci.yml'
  pull_request:
    paths:
      - '.agents/skills/hermes-agent-architecture/**'
      - '.agents/skills/hermes-agent-creator/SKILL.md'
      - 'SKILLS.md'
      - '.claude/skills/hermes-agent-architecture/**'
      - '.github/workflows/hermes-architecture-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Hermes knowledge skill
        run: python .agents/skills/hermes-agent-architecture/tests/validate_skill.py
      - name: Run Hermes architecture regressions
        run: python .agents/skills/hermes-agent-architecture/tests/test_architecture_regressions.py
      - name: Run Hermes release-impact regressions
        run: python .agents/skills/hermes-agent-architecture/tests/test_release_impact.py
