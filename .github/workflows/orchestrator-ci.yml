name: Orchestrator CI

on:
  push:
    branches:
      - main
      - 'orchestrator-v*'
    paths:
      - 'AGENTS.md'
      - '.agents/skills/usage-efficient-orchestrator/**'
      - '.codex/**'
      - 'tests/orchestrator/**'
      - 'scripts/*orchestrator*'
      - 'scripts/test-observability.mjs'
      - 'scripts/test-usage-intelligence.mjs'
      - 'docs/codex-usage-orchestrator.md'
      - 'docs/orchestrator-v*.md'
      - '.github/workflows/orchestrator-ci.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/usage-efficient-orchestrator/**'
      - '.codex/**'
      - 'tests/orchestrator/**'
      - 'scripts/*orchestrator*'
      - 'scripts/test-observability.mjs'
      - 'scripts/test-usage-intelligence.mjs'
      - 'docs/codex-usage-orchestrator.md'
      - 'docs/orchestrator-v*.md'
      - '.github/workflows/orchestrator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run orchestrator QA
        run: node scripts/orchestrator-qa.mjs
